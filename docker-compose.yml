services:
  mcp-web-engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5050:5050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_KEY: "${API_KEY:?Set an operator-generated API_KEY of at least 32 characters}"
      SEARXNG_URL: "${SEARXNG_URL:-http://host.docker.internal:8082/search}"
      ALLOW_DDG_FALLBACK: "false"
      HOST: "0.0.0.0"
      PORT: "5050"
      LOG_LEVEL: "INFO"
    restart: unless-stopped
    volumes:
      - usage-state:/home/appuser/.local/state/mcp-web-engine
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  usage-state:
