[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-web-engine"
version = "1.0.5"
description = "Privacy-First, Self-Hostable & SSRF-Hardened MCP Server & Web Engine for AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Arbolencio" }
]
keywords = [
    "mcp",
    "mcp-server",
    "searxng",
    "web-search",
    "ai-agent",
    "turbollm",
    "web-scraper",
    "ssrf-protection"
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "curl-cffi>=0.6.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.1.14",
    "sse-starlette>=2.0.0"
]

[project.scripts]
mcp-web-engine = "mcp_web_engine.main:cli_entrypoint"

[project.urls]
Homepage = "https://github.com/Arbolencio/mcp-web-engine"
Repository = "https://github.com/Arbolencio/mcp-web-engine.git"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_web_engine"]
